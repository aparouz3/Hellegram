name: Build Telegram APK (Screen Time Feature)

on:
  push:
    branches: [ main, master, clean-test ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'

    - name: Install ccache
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq ccache
        ccache --version | head -1
        mkdir -p ~/.ccache
        ccache --set-config=max_size=600M
        ccache --set-config=sloppiness=pch_defines,time_macros

    - name: Cache ccache (native code)
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-${{ hashFiles('TMessagesProj/jni/**') }}
        restore-keys: |
          ccache-${{ runner.os }}-

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Free up disk space (remove unused pre-installed tools)
      run: |
        # 1. Stop heavy services
        sudo systemctl stop "docker*" "containerd*" "snapd*" 2>/dev/null || true
        sudo pkill -f "dockerd\|containerd\|snapd" 2>/dev/null || true
        # 2. Remove huge pre-installed toolchains (dotnet, ghc, android emulators, LLVM, etc.)
        sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/go /opt/ghc /usr/local/share/boost 2>/dev/null || true
        sudo rm -rf /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/system-images 2>/dev/null || true
        sudo rm -rf /usr/local/lib/android/sdk/skins /usr/local/lib/android/sdk/.temp 2>/dev/null || true
        sudo rm -rf /usr/local/lib/android/sdk/platforms/android-* 2>/dev/null || true  # keep only the one we need
        sudo rm -rf /usr/local/share/powershell /opt/microsoft /opt/MySQL 2>/dev/null || true
        # 3. Clear apt cache
        sudo apt-get clean -y 2>/dev/null || true
        sudo apt-get autoremove -y 2>/dev/null || true
        # 4. Clear kernel caches and drop caches
        sync
        echo 3 | sudo tee /proc/sys/vm/drop_caches > /dev/null 2>&1 || true
        # 5. Create a 2GB swap file (helps with OOM)
        sudo fallocate -l 2G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048 2>/dev/null || true
        sudo chmod 600 /swapfile && sudo mkswap /swapfile 2>/dev/null && sudo swapon /swapfile 2>/dev/null || true
        # 6. Show free space
        df -h /
        echo "---"
        free -h

    - name: Build Debug APK
      run: ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace --max-workers=4
      env:
        APP_VERSION_CODE: 7038
        APP_VERSION_NAME: 12.10.1-no-logs
        APP_PACKAGE: org.telegram.messenger
        IS_PRIVATE: false
        RELEASE_KEY_PASSWORD: android
        RELEASE_KEY_ALIAS: androidkey
        RELEASE_STORE_PASSWORD: android
        CMAKE_BUILD_PARALLEL_LEVEL: '4'
        USE_CCACHE: '1'

    - name: Publish Release (latest-build)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete latest-build --yes --cleanup-tag 2>/dev/null || true
        cp TMessagesProj_App/build/outputs/apk/afat/debug/*.apk /tmp/Hellegram-APK.apk
        gh release create latest-build /tmp/Hellegram-APK.apk \
          --title "Hellegram — جدیدترین بیلد" \
          --notes "Build from commit \`${{ github.sha }}\`"