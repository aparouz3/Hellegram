name: Build Telegram APK (Screen Time Feature)

on:
  push:
    branches: [ main, master, clean-test ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace
      env:
        APP_VERSION_CODE: 6991
        APP_VERSION_NAME: 12.9.5-no-logs
        APP_PACKAGE: org.telegram.messenger
        IS_PRIVATE: false
        RELEASE_KEY_PASSWORD: android
        RELEASE_KEY_ALIAS: androidkey
        RELEASE_STORE_PASSWORD: android

    - name: Publish Release (latest-build)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete latest-build --yes --cleanup-tag 2>/dev/null || true
        cp TMessagesProj_App/build/outputs/apk/afat/debug/*.apk /tmp/Hellegram-APK.apk
        gh release create latest-build /tmp/Hellegram-APK.apk \
          --title "Hellegram — جدیدترین بیلد" \
          --notes "Build from commit \`${{ github.sha }}\`"