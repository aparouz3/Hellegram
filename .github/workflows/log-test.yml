name: LOG TEST
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
    - name: Echo test
      run: |
        echo "HELLO LOG TEST - if you can read this, log capture works"
        uname -a
        free -h
        nproc
    - name: Checkout
      uses: actions/checkout@v4
    - name: Repo size
      run: |
        du -sh . 2>/dev/null | head -1
        echo "REPO SIZE CHECKED"
